[project]
name = "cpm_projekt_14_vorhersage_numerischer_Werte"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.14.4"
authors = [
    { name = "Test Test", email = "test.test@test.com" }
]

dependencies = [
  "pandas>=2.2.3",
  "numpy>=2.2.5",
  "ipykernel==7.1.0",
  "dotenv>=0.9.9",
  "pyodbc>=5.3.0",
  "sqlalchemy>=2.1.4",
  "pymssql>=2.4.4",
  "fastparquet>=2026.9.0",
  "pyarrow>=26.0.0",
  "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
  "ruff>=0.15.16",
  "pre-commit>=4.6.0",
  "pytest>=9.1.0",
]


[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
include = ["vnw*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
